<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статистика — Task Planner</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="index.html">Task Planner</a>
      <nav class="nav" aria-label="Основная навигация">
        <a class="nav__link" href="index.html">Планировщик</a>
        <a class="nav__link active" href="stats.html" aria-current="page">Статистика</a>
      </nav>
      <button class="btn" id="randomBtn" type="button">🎲&nbsp;&nbsp;Случайная задача</button>
    </div>
  </header>

  <main class="container">
    <section class="cards" id="cards" aria-label="Основные показатели"></section>

    <section class="ranking" aria-labelledby="rankingTitle">
      <div class="ranking__head">
        <h2 class="section-title" id="rankingTitle">Топ-10 пользователей</h2>
        <div class="sort" id="sort" aria-hidden="true">
          <button class="sort__btn active" type="button" data-sort="total">По числу задач</button>
          <button class="sort__btn" type="button" data-sort="percent">По проценту выполнения</button>
        </div>
      </div>
      <div class="rating" id="rating">Загрузка…</div>
    </section>

    <section class="user-tasks" id="userTasks" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
